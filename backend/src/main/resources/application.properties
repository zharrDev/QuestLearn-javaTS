# =====================
# QuestLearn Backend — Quarkus
# =====================

# HTTP
quarkus.http.port=8080
quarkus.http.limits.max-body-size=10M

# CORS (frontend dev server)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=false

# H2 datasource (dev)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/questlearn;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.sql-parameters=false

# Security — permit public paths, require auth for the rest, admin role for /api/admin
quarkus.http.auth.permission.public.paths=/api/auth/*,/api/public/*,/h2-console/*,/swagger-ui/*,/swagger-ui.html,/q/swagger-ui/*,/q/openapi,/uploads/*,/api-docs/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.admin.paths=/api/admin/*
quarkus.http.auth.permission.admin.policy=roles:ADMIN
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# JWT (jjwt — same secret as before so existing tokens stay valid)
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# File upload
app.upload.dir=./uploads

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/api-docs
quarkus.swagger-ui.always-include=true
